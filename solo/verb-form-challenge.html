<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verb Forms Challenge</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e8f4f8; background: #090d14; color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; padding: 32px 16px; background: radial-gradient(circle at 12% 8%,#172738 0 10%,transparent 36%), radial-gradient(circle at 88% 18%,#102c35 0 9%,transparent 34%), linear-gradient(145deg,#080b11 0%,#101722 52%,#071116 100%); background-attachment: fixed; }
    main { max-width: 860px; margin: auto; }
    h1 { margin-bottom: 6px; font-size: clamp(1.8rem, 4vw, 2.6rem); }
    p { color: #a9bbc5; line-height: 1.5; }
    .panel, .card { background: linear-gradient(145deg,rgba(25,32,43,.98),rgba(14,21,30,.98)); border: 1px solid #344453; border-radius: 12px; box-shadow: 0 8px 24px #0008; }
    .panel { padding: 24px; }
    button { border: 1px solid #2fb8c4; padding: 11px 17px; border-radius: 9px; background: #147f8d; color: #f2feff; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #1b9eac; }
    button.secondary { background: #273545; border-color: #46596b; color: #d7e6ee; }
    button.secondary:hover { background: #34475a; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    #quiz-panel > .actions button { padding: 8px 13px; font-size: .75rem; border-radius: 7px; }
    .card { padding: 17px 20px; }
    .card h2 { margin: 0 0 12px; font-size: 1.1rem; overflow-wrap: anywhere; }
    .choices { display: flex; flex-wrap: wrap; gap: 12px 25px; margin: 12px 0; }
    .question-words { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 13px; margin: 10px 0 18px; }
    .letter-word { display: inline-flex; align-items: center; gap: 1px; min-height: 24px; }
    .letter-img { width: clamp(14px, 2.5vw, 24px); height: clamp(14px, 2.5vw, 24px); object-fit: contain; display: block; }
    .question-words .letter-img { width: clamp(18px, 3vw, 29px); height: clamp(18px, 3vw, 29px); }
    .word-separator { color: #768999; font-size: 1.4rem; font-weight: 800; }
    .missing-word { min-width: 64px; height: 28px; border-bottom: 3px solid #29baca; border-radius: 4px; }
    .choices button { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
    .choice-label { font-size: 1.05rem; color: #000; }
    .choices .letter-img { width: 19px; height: 19px; filter: brightness(0); }
    .feedback { font-weight: 700; min-height: 1.5em; }
    .feedback.good { color: #6de6a1; }
    .feedback.bad { color: #ff8e8e; }
    .choices button:disabled { cursor: default; opacity: .68; }
    .choices button.correct { background: #17683e; color: white; opacity: 1; }
    .summary { margin-top: 18px; }
    .summary table { width: 100%; border-collapse: collapse; }
    .summary th, .summary td { text-align: left; padding: 8px; border-bottom: 1px solid #344453; }
    .screen-title { margin-top: 0; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 15px; margin: 18px 0; }
    label { display: grid; gap: 6px; color: #c3d4dc; font-weight: 700; }
    input { width: 100%; border: 2px solid #4b5c6d; border-radius: 9px; padding: 11px 12px; font: inherit; color: #eef9fc; background: #0c121a; }
    input:focus { outline: 3px solid #247f8b; border-color: #37c5d2; }
    .student-line { color: #b8ced8; font-weight: 700; margin: 0 0 12px; }
    .answered-box { display: grid; place-items: center; min-height: 145px; margin-bottom: 18px; border: 1px solid #293b48; border-radius: 15px; background: linear-gradient(135deg,#111c29,#0a151b); }
    .answered-number { font-size: clamp(2.25rem,8vw,4rem); font-weight: 900; line-height: .9; color: #49d8e4; }
    .answered-label { margin-top: 8px; color: #9dafb9; font-weight: 750; }
    .records-tools { display: flex; gap: 9px; flex-wrap: wrap; margin: 14px 0; }
    .danger { background: #aa3030; }
    .danger:hover { background: #852323; }
    .records-wrap { overflow-x: auto; }
    .empty-note { padding: 18px; border-radius: 10px; background: #0c131c; }
    .time-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
    .time-name { width: 78px; flex: none; }
    .time-track { height: 18px; flex: 1; background: #27313d; border-radius: 999px; overflow: hidden; }
    .time-bar { height: 100%; border-radius: inherit; background: #31bac8; }
    .time-bar.incorrect { background: #e49a69; }
    .time-value { width: 58px; text-align: right; }
    @media (max-width: 620px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Verb Forms Challenge</h1>
    <section class="panel" id="sign-in-panel">
      <h2 class="screen-title">Student sign in</h2>
      <p>Enter your school number and English name before beginning.</p>
      <form id="student-form">
        <div class="form-grid">
          <label>School number<input id="school-number" required maxlength="30" autocomplete="off"></label>
          <label>English name<input id="english-name" required maxlength="40" autocomplete="off"></label>
        </div>
        <div class="actions">
          <button id="start-first-session" type="button">Start 10 questions</button>
          <button class="secondary" id="view-records" type="button">Teacher records</button>
        </div>
      </form>
      <p id="sign-in-status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" id="quiz-panel" hidden>
      <p class="student-line" id="current-student"></p>
      <div class="answered-box" aria-live="polite">
        <div><div class="answered-number" id="answered-number">0</div><div class="answered-label">of 10 answered</div></div>
      </div>
      <p>Choose the missing verb form. Each session contains ten questions.</p>
      <div class="actions"><button id="start-game" type="button" hidden>Start another session</button><button id="change-student" class="secondary" type="button">Change student</button></div>
      <p id="auto-status" role="status" aria-live="polite"></p>
      <section id="auto-result" aria-label="Current automatic question"></section>
      <section id="game-summary" class="summary" aria-label="Timing results"></section>
    </section>
    <section class="panel" id="records-panel" hidden>
      <h2 class="screen-title">Teacher records</h2>
      <p>Compare each student's ten-question sessions. Records are kept in this browser.</p>
      <div class="records-tools">
        <button id="export-csv" type="button">Export CSV</button>
        <button id="backup-json" class="secondary" type="button">Save USB backup</button>
        <button id="restore-json" class="secondary" type="button">Restore backup</button>
        <input id="restore-file" type="file" accept="application/json,.json" hidden>
        <button id="clear-records" class="danger" type="button">Delete all records</button>
        <button id="close-records" class="secondary" type="button">Back</button>
      </div>
      <div id="records-content" class="records-wrap"></div>
    </section>
  </main>
<script>
// Shared spelling and verb-form distractor rules.
(function (global) {
  const suffixes = ['ed','en','ing','er','ise','or','y','an','ly','ize','ate','ous','ive','ish','ful','ant','ity','ism','ee','ist','sion','tion','ment','able','ion'];
  const vowelPairs = ['ei','ie','ee','ea'];
  const sounds = [['ph','f'],['f','ph'],['ck','k'],['qu','kw'],['qu','cu'],['qu','ku'],['cu','qu'],['ku','qu'],['tion','shun'],['ai','ay'],['ay','ai'],['ou','ow'],['ow','ou'],['c','k'],['k','c'],['s','z'],['y','i'],['i','y'],['a','e'],['e','a'],['o','u']];
  const consonant = /[bcdfghjklmnpqrstvwxyz]/i;
  const vowel = /[aeiou]/i;
  const families = Object.freeze({
    'form-recycling':'form-pattern','suffix-ed':'verb-ending','suffix-en':'verb-ending','suffix-ing':'verb-ending',
    'suffix-ed-doubling':'verb-ending','suffix-en-doubling':'verb-ending','suffix-ing-doubling':'verb-ending',
    'suffix-er':'word-family','suffix-er-doubling':'word-family','suffix-ise':'word-family','suffix-or':'word-family','suffix-y':'word-family','suffix-an':'word-family','suffix-ly':'word-family','suffix-ize':'word-family','suffix-ate':'word-family','suffix-ous':'word-family','suffix-ive':'word-family','suffix-ish':'word-family','suffix-ful':'word-family','suffix-ant':'word-family','suffix-ity':'word-family','suffix-ism':'word-family','suffix-ee':'word-family','suffix-ist':'word-family','suffix-sion':'word-family','suffix-tion':'word-family','suffix-ment':'word-family','suffix-able':'word-family','suffix-ion':'word-family',
    'letter-missing':'letter-edit','letter-swap-adjacent':'letter-order','letter-swap-internal':'letter-order','sound-confusion':'phonetic'
  });
  const selectedTypes = () => new Set(Object.keys(families));
  function hasAllowedConsonantDoubles(word) {
    const lower = word.toLowerCase();
    for (let i = 0; i < lower.length - 1; i++) {
      if (lower[i] === lower[i + 1] && consonant.test(lower[i]) && !vowel.test(lower[i + 2] || '')) return false;
      if (lower[i] === lower[i + 1] && /[aiu]/.test(lower[i])) return false;
      if (lower[i] === lower[i + 1] && vowel.test(lower[i]) && lower[i + 2] === lower[i]) return false;
    }
    return true;
  }
  function caseLike(source, replacement) {
    if (source === source.toUpperCase()) return replacement.toUpperCase();
    if (source[0] === source[0].toUpperCase()) return replacement[0].toUpperCase() + replacement.slice(1);
    return replacement;
  }
  function appendSuffix(stem, suffix) {
    const lower = stem.toLowerCase();
    if (suffix === 'ing' && lower.endsWith('e') && !lower.endsWith('ee')) return stem.slice(0, -1) + suffix;
    if (suffix === 'ed' && lower.endsWith('e')) return stem + 'd';
    if (suffix === 'er' && lower.endsWith('e')) return stem + 'r';
    if (['ed','en','ing','er'].includes(suffix) && shouldDouble(stem)) return stem + stem.slice(-1) + suffix;
    if (suffix === 'tion' && lower.endsWith('te')) return stem.slice(0, -2) + 'tion';
    if (suffix === 'sion' && lower.endsWith('de')) return stem.slice(0, -2) + 'sion';
    return stem + suffix;
  }
  function shouldDouble(stem) {
    const lower = stem.toLowerCase();
    if (lower.endsWith('e') || lower.length < 3) return false;
    return consonant.test(lower[lower.length - 1]) && vowel.test(lower[lower.length - 2]) && consonant.test(lower[lower.length - 3]) && !/[wxy]/.test(lower[lower.length - 1]);
  }
  function addsConsonantDouble(value, stem) {
    const lower = value.toLowerCase(), source = stem.toLowerCase();
    for (let i = 0; i < lower.length - 1; i++) if (lower[i] === lower[i + 1] && consonant.test(lower[i]) && !source.includes(lower[i] + lower[i])) return true;
    return false;
  }
  function makeCandidates(answer, context) {
    const list = [];
    const seen = new Set([answer.toLowerCase()]);
    const add = (value, type) => {
      if (typeof value !== 'string' || !/^[a-z]+$/i.test(value) || value.toLowerCase() === answer.toLowerCase() || seen.has(value.toLowerCase()) || !hasAllowedConsonantDoubles(value)) return;
      if (type.startsWith('suffix-') && !type.endsWith('-doubling') && addsConsonantDouble(value, baseForm)) return;
      seen.add(value.toLowerCase());
      list.push({value, type, family:families[type] || 'other'});
    };
    const forms = context && Array.isArray(context.forms) ? context.forms : [];
    const baseForm = forms[0] || answer;
    forms.forEach(form => add(form, 'form-recycling'));
    if (baseForm.length > 2) for (let i = 0; i < baseForm.length; i++) add(baseForm.slice(0,i) + baseForm.slice(i + 1), 'letter-missing');
    for (let i = 0; i < answer.length; i++) {
      if (i + 1 < answer.length && answer[i].toLowerCase() !== answer[i + 1].toLowerCase()) add(answer.slice(0,i) + answer[i + 1] + answer[i] + answer.slice(i + 2), 'letter-swap-adjacent');
      for (let j = i + 2; j < answer.length; j++) if (answer[i].toLowerCase() !== answer[j].toLowerCase()) {
        const chars = answer.split(''); [chars[i], chars[j]] = [chars[j], chars[i]];
        add(chars.join(''), 'letter-swap-internal');
      }
    }
    const lower = answer.toLowerCase();
    for (const [from,to] of sounds) {
      let start = 0, index;
      while ((index = lower.indexOf(from, start)) !== -1) {
        add(answer.slice(0,index) + caseLike(answer.slice(index,index + from.length),to) + answer.slice(index + from.length), 'sound-confusion');
        start = index + 1;
      }
    }
    for (const from of vowelPairs) {
      let start = 0, index;
      while ((index = lower.indexOf(from,start)) !== -1) {
        for (const to of vowelPairs) if (to !== from) add(answer.slice(0,index) + caseLike(answer.slice(index,index + from.length),to) + answer.slice(index + from.length), 'sound-confusion');
        start = index + 1;
      }
    }
    for (const suffix of suffixes) {
      const type = 'suffix-' + suffix + (['ed','en','ing','er'].includes(suffix) && shouldDouble(baseForm) ? '-doubling' : '');
      add(appendSuffix(baseForm, suffix), type);
    }
    return list;
  }
  function shuffle(items, rng) {
    for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [items[i],items[j]] = [items[j],items[i]]; }
    return items;
  }
  function candidates(word, selected, context) { return makeCandidates(word, context || (selected && !selected.has ? selected : null)); }
  function base(word, count, selected, context, rng) {
    const random = rng || Math.random;
    const pool = shuffle(makeCandidates(word, context), random);
    const chosen = [], usedValues = new Set([word.toLowerCase()]), usedFamilies = new Set(), usedTypes = new Set();
    for (const family of ['form-pattern','verb-ending','letter-order','word-family','phonetic','letter-edit','other']) {
      for (const item of pool) if (item.family === family && !usedFamilies.has(item.family) && !usedValues.has(item.value.toLowerCase())) {
        chosen.push(item); usedValues.add(item.value.toLowerCase()); usedFamilies.add(item.family); usedTypes.add(item.type);
        break;
      }
      if (chosen.length >= count) return chosen;
    }
    for (const item of pool) if (!usedTypes.has(item.type) && !usedValues.has(item.value.toLowerCase())) {
      chosen.push(item); usedValues.add(item.value.toLowerCase()); usedTypes.add(item.type);
      if (chosen.length >= count) return chosen;
    }
    for (const item of pool) if (!usedValues.has(item.value.toLowerCase())) {
      chosen.push(item); usedValues.add(item.value.toLowerCase());
      if (chosen.length >= count) break;
    }
    return chosen;
  }
  function createDistractorRecords(answer, validForms, count, rng, context) {
    return base(answer, count, selectedTypes(), context, rng);
  }
  function createDistractors(answer, validForms, count, rng, context) {
    return createDistractorRecords(answer, validForms, count, rng, context).map(item => item.value);
  }
  global.SpellingRules = Object.freeze({rules:Object.freeze(Object.keys(families).map(id => Object.freeze({id,family:families[id]}))), base, selectedTypes, candidates, hasAllowedConsonantDoubles, createDistractorRecords, createDistractors, suffixes:Object.freeze(suffixes.slice())});
})(window);
</script>

      group.className = 'letter-word';
      group.setAttribute('aria-label',word);
      for (const letter of word.toUpperCase()) {
        const image = document.createElement('img');
        image.className = 'letter-img';

        image.alt = letter;
        image.draggable = false;
        group.append(image);
      }
      return group;
    }

            const seconds = Math.max(0,(performance.now()-startedAt)/1000);
            const right = word === correct;
            if (right) score++;
            roundResults.push({correct:right,seconds});
            feedback.textContent = right ? `Correct! ${seconds.toFixed(2)} seconds.` :
              `Incorrect. The correct word form is ${correct}. ${seconds.toFixed(2)} seconds.`;
            feedback.classList.add(right ? 'good' : 'bad');
            document.getElementById('answered-number').textContent = String(round);
            choices.querySelectorAll('button').forEach(button => {
              button.disabled = true;
              if (button.dataset.word === correct) button.classList.add('correct');
            });
            message.textContent = `Question ${round} of ${SESSION_LENGTH} · Score: ${score}`;
            nextTimer = setTimeout(nextQuestion, 2200);
          });
          choices.append(choice);
        });
        card.append(choices,feedback);
        target.replaceChildren(card);
        // Start timing immediately before the browser paints the choices.
        const activateChoices = () => {
          if (target.firstChild !== card) return;
          startedAt = performance.now();
          choices.querySelectorAll('button').forEach(button => { button.disabled = false; });
        };
        if (typeof requestAnimationFrame === 'function') requestAnimationFrame(activateChoices);
        else setTimeout(activateChoices,0);
        message.textContent = `Question ${round} of ${SESSION_LENGTH} · Score: ${score}`;
        return;
      }
      target.replaceChildren();
      message.textContent = 'The selected Base settings cannot make enough choices. Enable more mistake types and start again.';
      document.getElementById('start-game').hidden = false;
    }
    function startSession() {
      clearTimeout(nextTimer);
      round = 0; score = 0; roundResults = [];
      document.getElementById('game-summary').replaceChildren();
      document.getElementById('answered-number').textContent = '0';
      document.getElementById('start-game').hidden = true;
      nextQuestion();
    }
    function showSignIn() {
      clearTimeout(nextTimer);
      document.getElementById('quiz-panel').hidden = true;
      document.getElementById('records-panel').hidden = true;
      document.getElementById('sign-in-panel').hidden = false;
      document.getElementById('school-number').focus();
    }
    function beginStudentSession() {
      const schoolNumber = document.getElementById('school-number').value.trim();
      const englishName = document.getElementById('english-name').value.trim();
      const status = document.getElementById('sign-in-status');
      if (!schoolNumber || !englishName) {
        status.textContent = 'Please enter both your school number and English name.';
        (schoolNumber ? document.getElementById('english-name') : document.getElementById('school-number')).focus();
        return;
      }
      status.textContent = '';
      try {
        currentStudent = {schoolNumber,englishName};
        document.getElementById('current-student').textContent = `${englishName} · School number ${schoolNumber}`;
        document.getElementById('sign-in-panel').hidden = true;
        document.getElementById('records-panel').hidden = true;
        document.getElementById('quiz-panel').hidden = false;
        startSession();
      } catch (error) {
        document.getElementById('quiz-panel').hidden = true;
        document.getElementById('sign-in-panel').hidden = false;
        status.textContent = `The game could not start: ${error && error.message ? error.message : 'unknown error'}`;
      }
    }
    document.getElementById('start-first-session').addEventListener('click', beginStudentSession);
    document.getElementById('student-form').addEventListener('submit', event => {
      event.preventDefault();
      beginStudentSession();
    });
    document.getElementById('school-number').addEventListener('change', event => {
      const match = getHistory().slice().reverse().find(item => String(item.schoolNumber).toLowerCase() === event.target.value.trim().toLowerCase());
      if (match) document.getElementById('english-name').value = match.englishName;
    });
    document.getElementById('start-game').addEventListener('click', startSession);
    document.getElementById('change-student').addEventListener('click', showSignIn);
    document.getElementById('view-records').addEventListener('click', () => {
      document.getElementById('sign-in-panel').hidden = true;
      document.getElementById('records-panel').hidden = false;
      renderRecords();
    });
    document.getElementById('close-records').addEventListener('click', showSignIn);
    document.getElementById('export-csv').addEventListener('click', () => {
      const rows = [['School number','English name','Completed at','Score','Questions','Correct average seconds','All-answer average seconds']];
      getHistory().forEach(item => rows.push([item.schoolNumber,item.englishName,item.completedAt,item.score,SESSION_LENGTH,item.averageCorrect ?? '',item.averageAll]));
      downloadFile(`verb-challenge-results-${new Date().toISOString().slice(0,10)}.csv`,rows.map(row => row.map(escapeCsv).join(',')).join('\r\n'),'text/csv;charset=utf-8');
    });
    document.getElementById('backup-json').addEventListener('click', () => {
      const backup = {app:'Verb Forms Challenge',version:2,exportedAt:new Date().toISOString(),sessions:getHistory()};
      downloadFile(`verb-challenge-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(backup,null,2),'application/json');
    });
    document.getElementById('restore-json').addEventListener('click', () => document.getElementById('restore-file').click());
    document.getElementById('restore-file').addEventListener('change', async event => {
      const file = event.target.files[0]; if (!file) return;
      try {
        const backup = JSON.parse(await file.text());
        if (!backup || backup.app !== 'Verb Forms Challenge' || !Array.isArray(backup.sessions)) throw new Error('Invalid backup');
        const existing = getHistory();
        const known = new Set(existing.map(item => `${item.schoolNumber}|${item.completedAt}`));
        const added = backup.sessions.filter(item => item && item.schoolNumber && item.englishName && item.completedAt && !known.has(`${item.schoolNumber}|${item.completedAt}`));
        if (!saveHistory([...existing,...added])) throw new Error('Storage unavailable');
        renderRecords(); alert(`${added.length} session${added.length === 1 ? '' : 's'} restored.`);
      } catch { alert('That file is not a valid Verb Forms Challenge backup.'); }
      event.target.value = '';
    });
    document.getElementById('clear-records').addEventListener('click', () => {
      if (!confirm('Delete every saved student session from this browser? This cannot be undone unless you have a backup.')) return;
      localStorage.removeItem(historyKey); renderRecords();
    });
  </script>
</body>
</html>
